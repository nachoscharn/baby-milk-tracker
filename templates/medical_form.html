<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#8b5a2b">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <title>Agregar estudio</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <div class="card">

        <h1>Agregar estudio</h1>

        <form method="POST">

            <label for="study_date">Fecha</label>
            <input
                type="date"
                id="study_date"
                name="study_date"
                required
            >

            <label for="study_type">Tipo de estudio</label>
            <input
                type="text"
                id="study_type"
                name="study_type"
                placeholder="Ej: Ecografía abdominal"
                required
            >

            <label for="doctor">Indicado por</label>
            <input
                type="text"
                id="doctor"
                name="doctor"
                placeholder="Ej: Dr. García — Pediatra"
            >

            <label for="result">Resultado / observaciones</label>
            <textarea
                id="result"
                name="result"
                rows="4"
                placeholder="Resultado o notas del estudio..."
            ></textarea>

            <button type="submit">Guardar</button>

            <a class="button secondary-button" href="{{ url_for('medical') }}">
                Cancelar
            </a>

        </form>

    </div>

</div>

</body>
</html>
