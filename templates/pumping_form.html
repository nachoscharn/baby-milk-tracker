<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#8b5a2b">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Nueva extracción</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
</head>

<body>

<div class="container">

    <div class="card">

        <h1>
            Registrar extracción
        </h1>

        <form method="POST">

            <label>ML extraídos:</label>

            <input
                type="number"
                name="amount_ml"
                min="0"
                required
            >

            <label>Lado:</label>

            <select name="side">
                <option value="left">Izquierdo</option>
                <option value="right">Derecho</option>
                <option value="both">Ambos</option>
            </select>

            <label>Fecha y hora manual (opcional):</label>

            <input
                type="datetime-local"
                name="created_at"
            >

            <button type="submit">
                <i class="fa-solid fa-check"></i>
                Guardar
            </button>

        </form>

        <a class="button" href="/">
            <i class="fa-solid fa-arrow-left"></i>
            Volver
        </a>

    </div>

</div>

</body>

</html>
