<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#8b5a2b">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <title>Configuración</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div class="container">

    <div class="card">

        <h1>
            <i class="fa-solid fa-sliders"></i>
            Configuración
        </h1>

        <form method="POST">

            <p class="settings-section-title">Inicio</p>

            <label class="toggle-label">
                <input
                    type="checkbox"
                    name="show_pumpings"
                    {% if settings.show_pumpings %}checked{% endif %}
                >
                <span class="toggle-text">
                    <i class="fa-solid fa-baby"></i>
                    Lactancia materna (pecho)
                </span>
            </label>
            <p style="font-size:0.8rem; color:#888; margin: 4px 0 0 0;">
                Activa tomas a pecho y registro de extracciones
            </p>

            <p class="settings-section-title" style="margin-top: 20px;">Tomas diarias</p>

            <label>Objetivo de ml diarios (opcional):</label>
            <input
                type="number"
                name="daily_ml_target"
                min="0"
                placeholder="Calculado por peso (200 ml/kg)"
                value="{{ settings.daily_ml_target if settings.daily_ml_target else '' }}"
            >
            <p style="font-size:0.8rem; color:#888; margin: 4px 0 0 0;">
                Si lo dejás vacío se calcula con el último peso registrado (200 ml/kg).
                Borrá el valor para volver al cálculo automático.
            </p>

            <button type="submit" style="margin-top: 24px;">
                Guardar
            </button>

            <a class="button secondary-button" href="{{ url_for('index') }}">
                <i class="fa-solid fa-arrow-left"></i>
                Volver
            </a>

        </form>

    </div>

</div>

</body>
</html>
