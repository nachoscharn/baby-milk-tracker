<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta name="theme-color" content="#8b5a2b">

    <link
        rel="manifest"
        href="{{ url_for('static', filename='manifest.json') }}"
    >

    <title>Registrar crecimiento</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

<div class="container">

    <div class="card">

        <h1>Registrar crecimiento</h1>

        <form method="POST">

            <label for="weight_kg">
                Peso (kg)
            </label>

            <input
                type="number"
                step="0.01"
                id="weight_kg"
                name="weight_kg"
                required
            >

            <label for="length_cm">
                Largo/altura (cm)
            </label>

            <input
                type="number"
                step="0.1"
                id="length_cm"
                name="length_cm"
                required
            >

            <label for="head_circumference_cm">
                Perímetro cefálico (cm)
            </label>

            <input
                type="number"
                step="0.1"
                id="head_circumference_cm"
                name="head_circumference_cm"
            >

            <button type="submit">
                Guardar
            </button>

        </form>

    </div>

</div>

</body>
</html>
