<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta name="theme-color" content="#8b5a2b">

    <link
        rel="manifest"
        href="{{ url_for('static', filename='manifest.json') }}"
    >

    <title>Perfil del bebé</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
</head>

<body>

<div class="container">

    <div class="card">

        <h1>
            <i class="fa-solid fa-baby"></i>
            Perfil del bebé
        </h1>

        <form method="POST">

            <label for="first_name">
                Nombre
            </label>
            
            <input
                type="text"
                id="first_name"
                name="first_name"
                required
                value="{{ profile.first_name if profile else '' }}"
            >
            
            <label for="last_name">
                Apellido
            </label>
            
            <input
                type="text"
                id="last_name"
                name="last_name"
                required
                value="{{ profile.last_name if profile else '' }}"
            >

            <label for="birth_date">
                Fecha de nacimiento
            </label>

            <input
                type="date"
                id="birth_date"
                name="birth_date"
                required
                value="{{ profile.birth_date.date().isoformat() if profile else '' }}"
            >

            <label for="sex">
                Sexo
            </label>

            <select
                id="sex"
                name="sex"
                required
            >
                <option value="">Seleccionar</option>

                <option
                    value="female"
                    {% if profile and profile.sex == "female" %}
                        selected
                    {% endif %}
                >
                    Femenino
                </option>

                <option
                    value="male"
                    {% if profile and profile.sex == "male" %}
                        selected
                    {% endif %}
                >
                    Masculino
                </option>

            </select>

            <button type="submit">
                Guardar perfil
            </button>

        </form>

    </div>

</div>

</body>
</html>
