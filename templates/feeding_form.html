<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Nueva toma</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
</head>

<body>

<div class="container">

    <div class="card">

        <h1>
            Registrar toma
        </h1>

        <form method="POST">

            <label>Tipo:</label>

            <select name="feeding_type" id="feeding_type">
                <option value="breast">Pecho</option>
                <option value="bottle">Mamadera</option>
            </select>

            <div id="side_field">

                <label>Lado:</label>

                <select name="side">
                    <option value="left">Izquierdo</option>
                    <option value="right">Derecho</option>
                    <option value="both">Ambos</option>
                </select>

            </div>

            <div id="amount_field">

                <label>ML:</label>

                <input
                    type="number"
                    name="amount_ml"
                    min="0"
                >

            </div>

            <label>Duración en minutos (opcional):</label>

            <input
                type="number"
                name="duration_min"
                min="0"
            >

            <label>Fecha y hora manual (opcional):</label>

            <input
                type="datetime-local"
                name="created_at"
            >

            <button type="submit">
                <i class="fa-solid fa-check"></i>
                Guardar
            </button>

        </form>

        <a class="button" href="/">
            <i class="fa-solid fa-arrow-left"></i>
            Volver
        </a>

    </div>

</div>

<script>
    function updateForm() {
        const feedingType = document.getElementById("feeding_type").value;
        const sideField = document.getElementById("side_field");
        const amountField = document.getElementById("amount_field");

        if (feedingType === "breast") {
            sideField.style.display = "block";
            amountField.style.display = "none";
        } else {
            sideField.style.display = "none";
            amountField.style.display = "block";
        }
    }

    document
        .getElementById("feeding_type")
        .addEventListener("change", updateForm);

    updateForm();
</script>

</body>

</html>
