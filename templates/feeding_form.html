<!DOCTYPE html>
<html lang="es">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <meta charset="UTF-8">
    <title>Nueva toma</title>
</head>

<body>
    <div class="container">
        <div class="card">

            <h1>Registrar toma</h1>

            <form method="POST">

                <label>Tipo:</label>
                <select name="feeding_type" id="feeding_type">
                    <option value="breast">Pecho</option>
                    <option value="bottle">Mamadera</option>
                </select>

                <br><br>

                <div id="side_field">
                    <label>Lado:</label>
                    <select name="side">
                        <option value="left">Izquierdo</option>
                        <option value="right">Derecho</option>
                        <option value="both">Ambos</option>
                    </select>
                    <br><br>
                </div>

                <div id="amount_field">
                    <label>ML:</label>
                    <input type="number" name="amount_ml">
                    <br><br>
                </div>

                <label>Duración en minutos (opcional):</label>
                <input type="number" name="duration_min">

                <br><br>

                <button type="submit">
                    Guardar
                </button>

            </form>

            <script>
                function updateForm() {
                    const feedingType = document.getElementById("feeding_type").value;
                    const sideField = document.getElementById("side_field");
                    const amountField = document.getElementById("amount_field");

                    if (feedingType === "breast") {
                        sideField.style.display = "block";
                        amountField.style.display = "none";
                    } else {
                        sideField.style.display = "none";
                        amountField.style.display = "block";
                    }
                }

                document.getElementById("feeding_type").addEventListener("change", updateForm);
                updateForm();
            </script>
        </div>
    </div>
</body>

</html>
