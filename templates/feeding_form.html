<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#8b5a2b">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Nueva toma</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
</head>

<body>

<div class="container">

    <div class="card">

        <h1>
            Registrar toma
        </h1>

        <form method="POST">

            {% if settings.show_pumpings %}
            <label>Tipo:</label>

            <select name="feeding_type" id="feeding_type">
                <option value="breast">Pecho</option>
                <option value="bottle">Mamadera</option>
            </select>
            {% else %}
            <input type="hidden" name="feeding_type" id="feeding_type" value="bottle">
            {% endif %}

            <div id="side_field">

                <label>Lado:</label>

                <select name="side">
                    <option value="left">Izquierdo</option>
                    <option value="right">Derecho</option>
                    <option value="both">Ambos</option>
                </select>

            </div>

            <div id="amount_field">

                <label>Cantidad (ml):</label>

                <input
                    type="number"
                    name="amount_ml"
                    min="0"
                >

            </div>

            <div id="duration_field">

                <label>Duración en minutos (opcional):</label>

                <input
                    type="number"
                    name="duration_min"
                    min="0"
                >

                <p style="font-size:0.8rem; color:#888; margin: 4px 0 0 0;">
                    Si estás registrando en tiempo real, podés dejarlo vacío
                    y usar "Terminó la toma" en el inicio.
                </p>

            </div>

            <label>Fecha y hora manual (opcional):</label>

            <input
                type="datetime-local"
                name="created_at"
            >

            <button type="submit" id="submit-btn">
                <i class="fa-solid fa-check"></i>
                Guardar
            </button>

        </form>

        <a class="button" href="/">
            <i class="fa-solid fa-arrow-left"></i>
            Volver
        </a>

    </div>

</div>

<script>
    function updateForm() {
        const feedingType = document.getElementById("feeding_type").value;
        const sideField = document.getElementById("side_field");
        const amountField = document.getElementById("amount_field");
        const durationField = document.getElementById("duration_field");

        if (feedingType === "breast") {
            sideField.style.display = "block";
            amountField.style.display = "none";
            durationField.style.display = "block";
        } else {
            sideField.style.display = "none";
            amountField.style.display = "block";
            durationField.style.display = "none";
        }
    }

    document
        .getElementById("feeding_type")
        .addEventListener("change", updateForm);

    updateForm();

    // Deshabilitar el botón al enviar para evitar duplicados mientras Render despierta
    document.querySelector("form").addEventListener("submit", function() {
        const btn = document.getElementById("submit-btn");
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Guardando...';
    });
</script>

</body>

</html>
